<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-container {
      width: min(400px, 100%);
      background: linear-gradient(180deg, rgba(17, 32, 59, 0.95), rgba(12, 18, 38, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
      padding: 42px;
      backdrop-filter: blur(18px);
    }

    .login-title {
      margin: 0 0 32px;
      font-size: 2rem;
      color: #f8f9ff;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #f8f9ff;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #f8f9ff;
      font-size: 1rem;
      transition: border-color 180ms ease;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #6d8cff;
    }

    .form-group input::placeholder {
      color: #b9c3dc;
    }

    .login-button {
      width: 100%;
      padding: 14px 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(109, 140, 255, 0.3), rgba(57, 79, 255, 0.4));
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8f9ff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .login-button:hover {
      transform: translateY(-2px);
      border-color: rgba(109, 140, 255, 0.55);
      box-shadow: 0 12px 24px rgba(72, 116, 255, 0.18);
    }

    .error-message {
      color: #ff6b6b;
      margin-top: 16px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <main class="page-shell" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="login-container">
      <h1 class="login-title">Connexion</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="userId">Identifiant</label>
          <input type="text" id="userId" placeholder="Entrez votre identifiant" required />
        </div>
        <div class="form-group">
          <label for="userPassword">Mot de passe</label>
          <input type="password" id="userPassword" placeholder="Entrez votre mot de passe" required />
        </div>
        <button type="submit" class="login-button">Se connecter</button>
        <div class="error-message" id="errorMessage">Identifiant ou mot de passe incorrect</div>
      </form>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
